<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARF Alert Dispatch</title>
<style>
  :root{
    --bg:#181a1d;
    --panel:#212428;
    --panel-2:#282c31;
    --line:#34383e;
    --text:#eceeef;
    --muted:#8b9099;
    --gate:#3fa7a0;
    --weather:#e8a33d;
    --safety:#d1453b;
    --clear:#4caf7d;
    --super:#e8c34d;
    --mono: 'IBM Plex Mono','SF Mono',Consolas,monospace;
    --sans: 'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:270px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); padding:24px 20px;
  }
  .brand{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:4px;
  }
  .brand-title{font-size:19px; font-weight:700; margin-bottom:20px; letter-spacing:-0.01em;}
  .section-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px; margin-top:24px;
  }
  .recip-list{display:flex; flex-direction:column; gap:8px;}
  .recip-item{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .recip-item.on{border-color:var(--gate); background:#20302e;}
  .recip-item input{accent-color:var(--gate); width:16px; height:16px;}
  .recip-name{font-weight:600; font-size:14px;}
  .recip-count{color:var(--muted); font-size:12px; margin-left:auto;}
  .all-btn{
    margin-top:12px; width:100%; padding:8px; border-radius:8px;
    border:1px dashed var(--line); background:transparent; color:var(--muted);
    font-size:12px; cursor:pointer; font-family:var(--sans);
  }
  .all-btn:hover{color:var(--text); border-color:var(--muted);}
  .all-btn.partial{color:var(--clear); border-color:var(--clear); border-style:solid;}
  .all-btn.all-selected{
    color:#fff; background:var(--safety); border-color:var(--safety); border-style:solid;
    font-weight:700;
  }
  .all-btn.all-selected:hover{color:#fff; border-color:var(--safety);}

  .view-locked{
    font-size:11px; color:var(--muted); padding:8px 12px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; margin-top:6px;
  }

  .nav-row{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
  .nav-btn{
    font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:100px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer;
    font-family:var(--sans);
  }
  .nav-btn.active{background:var(--panel-2); color:var(--text); border-color:var(--muted);}

  .locked-note{
    grid-column:1/-1; background:var(--panel); border:1px dashed var(--line); border-radius:10px;
    padding:22px; text-align:center; color:var(--muted); font-size:13px;
  }

  .admin-section{margin-bottom:32px;}
  .admin-section h3{font-size:14px; margin:0 0 12px;}
  .role-group{border:1px solid var(--line); border-radius:10px; padding:16px 18px; background:rgba(255,255,255,0.012);}
  .role-group h3{display:flex; align-items:center; gap:2px; margin-bottom:14px;}
  .superuser-group{border-left:3px solid var(--super);}
  .staff-group{border-left:3px solid var(--gate);}
  .group-note{font-size:11px; font-weight:400; color:var(--muted); margin-left:10px; letter-spacing:0;}
  table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.data-table th{
    text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line);
  }
  table.data-table td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr.editing-row td{background:#2a2f1f; border-top:1px solid var(--super); border-bottom:1px solid var(--super);}
  tr.editing-row select:not(:disabled), tr.editing-row input:not(:disabled){border-color:var(--super); box-shadow:0 0 0 1px var(--super);}
  .role-select, .site-select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:4px 8px; font-size:12px; font-family:var(--sans);
  }
  .remove-link{color:var(--safety); background:none; border:none; font-size:12px; cursor:pointer; font-weight:600; font-family:var(--sans);}
  .edit-link{color:var(--gate); background:none; border:none; font-size:12px; cursor:pointer; font-weight:600; font-family:var(--sans);}
  .reset-pin-link{color:var(--weather); background:none; border:none; font-size:12px; cursor:pointer; font-weight:600; font-family:var(--sans);}
  .add-user-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .add-user-row input{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px;
    padding:7px 10px; font-size:13px; font-family:var(--sans); flex:1; min-width:90px;
  }
  .add-user-row select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px;
    padding:7px 10px; font-size:13px; font-family:var(--sans);
  }
  .add-btn{
    background:var(--gate); color:#0d1a19; border:none; border-radius:6px; padding:7px 14px;
    font-weight:700; font-size:12.5px; cursor:pointer; font-family:var(--sans);
  }

  .login-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
    justify-content:center; z-index:100; flex-direction:column; gap:22px;
  }
  .login-card{
    width:300px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; text-align:center;
  }
  .login-brand{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
  .login-title{font-size:18px; font-weight:700; margin-bottom:20px;}
  .pin-dots{display:flex; justify-content:center; gap:12px; margin-bottom:20px;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:transparent; transition:background .1s, border-color .1s;}
  .pin-dot.filled{background:var(--gate); border-color:var(--gate);}
  .pin-dot.err{background:var(--safety); border-color:var(--safety);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .key{
    padding:14px 0; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-size:17px; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .key:hover{border-color:var(--muted);}
  .key.wide{grid-column:span 1; font-size:12px; color:var(--muted); font-weight:700;}
  .login-error{font-size:12px; color:var(--safety); min-height:16px; margin-top:2px;}
  .forgot-pin-link{
    margin-top:14px; background:none; border:none; color:var(--gate); font-size:12px;
    font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .forgot-pin-panel{margin-top:12px; text-align:left;}
  .forgot-pin-input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13px; font-family:var(--sans); margin-top:6px;
  }

  .signed-in-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .signed-in-info{font-size:12.5px;}
  .signed-in-info .who{font-weight:700; display:block;}
  .signed-in-info .role{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em;}
  .switch-user-btn{
    font-size:11px; color:var(--gate); background:none; border:none; cursor:pointer; font-weight:700;
    font-family:var(--sans); white-space:nowrap;
  }
  .pin-cell{font-family:var(--mono); font-size:12px; color:var(--muted);}

  .role-icon{display:inline-flex; vertical-align:middle; margin-right:5px; flex-shrink:0;}
  .role-icon.admin{color:var(--gate);}
  .role-icon.user{color:var(--muted);}
  .role-icon.superadmin{color:var(--super);}
  .role-badge{display:inline-flex; align-items:center;}
  .nav-btn .role-icon{margin-right:6px;}

  .site-box{margin-bottom:18px;}
  .site-box .rb-label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .site-select-full{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13px; font-family:var(--sans); font-weight:700;
  }
  .site-chip{
    display:inline-block; background:var(--panel-2); border:1px solid var(--line); border-radius:100px;
    padding:4px 12px; font-size:12.5px; font-weight:700;
  }

  .recip-block{display:flex; flex-direction:column; gap:4px;}
  .recip-import{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2px; margin-top:2px; margin-bottom:2px;
  }
  .import-link{
    font-size:11px; color:var(--gate); background:none; border:none; cursor:pointer;
    font-family:var(--sans); font-weight:600; padding:0;
  }
  .import-link:hover{text-decoration:underline;}
  .import-note{font-size:10.5px; color:var(--muted);}
  .import-error{font-size:10.5px; color:var(--safety); margin-top:2px;}
  .import-picker{display:flex; gap:6px; margin-bottom:6px;}
  .import-target-select{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:12px; font-family:var(--sans);
  }
  .import-choose-btn{
    background:var(--gate); color:#0d1a19; border:none; border-radius:6px; padding:6px 12px;
    font-weight:700; font-size:12px; cursor:pointer; font-family:var(--sans); white-space:nowrap;
  }
  .import-picker-note{font-size:10.5px; color:var(--muted); margin-bottom:6px;}

  .main{flex:1; padding:32px 40px; max-width:960px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:28px;}

  .tabs{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 4px; margin-right:20px; font-size:13px; font-weight:600;
    color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;
    display:flex; align-items:center; gap:7px;
  }
  .tab.active{color:var(--text);}
  .dot{width:8px; height:8px; border-radius:50%;}
  .tab[data-cat="gate"].active{border-color:var(--gate);}
  .tab[data-cat="weather"].active{border-color:var(--weather);}
  .tab[data-cat="safety"].active{border-color:var(--safety);}
  .tab[data-cat="test"].active{border-color:var(--muted);}
  .tab[data-cat="heat"].active{border-color:#e8c34d;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .subgroup{grid-column:1 / -1; display:flex; flex-direction:column; gap:12px;}
  .subgroup-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin:4px 0 -2px;
  }
  .subgroup-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .alert-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px; cursor:pointer; text-align:left; color:var(--text);
    font-family:var(--sans); transition:transform .1s, border-color .15s;
  }
  .alert-card:hover{transform:translateY(-1px); border-color:var(--accent);}
  .alert-card .name{font-weight:700; font-size:14.5px; margin-bottom:6px;}
  .alert-card .preview{color:var(--muted); font-size:12.5px; font-family:var(--mono); line-height:1.5;}
  .badge{
    display:inline-block; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    padding:2px 7px; border-radius:100px; margin-bottom:8px; font-weight:700;
  }
  [data-cat-card="gate"] .badge{background:#173634; color:var(--gate);}
  [data-cat-card="weather"] .badge{background:#3a2c14; color:var(--weather);}
  [data-cat-card="safety"] .badge{background:#3a1a17; color:var(--safety);}
  [data-cat-card="test"] .badge{background:#2a2c30; color:var(--muted);}
  [data-cat-card="heat"] .badge{background:#3a3418; color:#e8c34d;}
  [data-cat-card="gate"]{--accent:var(--gate);}
  [data-cat-card="weather"]{--accent:var(--weather);}
  [data-cat-card="safety"]{--accent:var(--safety);}
  [data-cat-card="test"]{--accent:var(--muted);}
  [data-cat-card="heat"]{--accent:#e8c34d;}
  .safety-critical{border-color:#5c2521 !important; background:#241413;}

  /* Overlay + modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,10,11,.72);
    display:none; align-items:center; justify-content:center; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}
  .modal{
    width:440px; max-width:92vw; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal.danger{border-color:#5c2521;}
  .modal-eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  .modal.danger .modal-eyebrow{color:var(--safety);}
  .modal h2{font-size:17px; margin:0 0 14px;}
  .to-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .to-pill{
    font-size:11.5px; font-weight:700; background:var(--panel-2); border:1px solid var(--line);
    padding:3px 10px; border-radius:100px; color:var(--text);
  }
  .msg-box{
    background:#101214; border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    font-family:var(--mono); font-size:13px; line-height:1.55; white-space:pre-wrap;
    margin-bottom:8px; min-height:60px;
  }
  .char-count{color:var(--muted); font-size:11px; text-align:right; margin-bottom:16px;}
  .time-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .time-row label{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
  .time-row input[type="time"]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px;
    padding:6px 10px; font-size:13px; font-family:var(--sans);
  }
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; padding:9px 16px;
    border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    cursor:pointer;
  }
  .btn.cancel:hover{border-color:var(--muted);}
  .btn.primary{background:var(--gate); border-color:var(--gate); color:#0d1a19;}
  .btn.primary.danger{background:var(--safety); border-color:var(--safety); color:#fff;}
  .warn-box{
    background:#241413; border:1px solid #5c2521; border-radius:8px; padding:10px 12px;
    font-size:12.5px; color:#f0b8b3; margin-bottom:16px; line-height:1.5;
  }
  .step-track{display:flex; gap:4px; margin-bottom:14px;}
  .step-track div{height:3px; flex:1; background:var(--line); border-radius:2px;}
  .step-track div.done{background:var(--safety);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--clear); color:var(--text);
    padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600;
    display:none; align-items:center; gap:8px; z-index:60;
  }
  .toast.show{display:flex;}
  .toast.danger-toast{border-color:var(--safety);}

  /* ---------- Mobile ---------- */
  @media (max-width: 820px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; border-right:none; border-bottom:1px solid var(--line);
      padding:16px 14px;
    }
    .main{padding:18px 14px; max-width:100%;}

    /* Alert cards stack single-column with a bigger tap target */
    .grid, .subgroup-grid{grid-template-columns:1fr;}
    .alert-card{padding:14px;}
    .alert-card .name{font-size:15.5px;}

    /* Tabs scroll rather than wrap */
    .tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap;}
    .tab{white-space:nowrap; margin-right:14px; flex-shrink:0;}
    .nav-row{overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
    .nav-btn{white-space:nowrap; flex-shrink:0;}

    /* Tables scroll horizontally instead of squashing */
    .admin-section table.data-table{min-width:640px;}
    .admin-section{overflow-x:auto;}

    /* Add-row inputs stack */
    .add-user-row{flex-direction:column; align-items:stretch;}
    .add-user-row input, .add-user-row select, .add-user-row button{width:100%; max-width:none !important;}

    .import-picker{flex-direction:column;}
    .import-choose-btn{width:100%;}

    /* Modal fills the screen so nothing is cut off */
    .modal{
      width:100%; max-width:100%; border-radius:14px 14px 0 0;
      max-height:92vh; overflow-y:auto; padding:18px 16px;
    }
    .overlay{align-items:flex-end;}
    .modal-actions{position:sticky; bottom:0; background:var(--panel); padding-top:10px;}
    .btn{flex:1; padding:12px 16px;}

    /* Login card fits narrow screens */
    .login-card{width:100%; max-width:340px;}
    .key{padding:16px 0; font-size:18px;}

    h1{font-size:19px;}
    .sub{font-size:13px;}
  }

  @media (max-width: 420px){
    .sidebar{padding:12px;}
    .main{padding:14px 12px;}
    .role-group{padding:12px 10px;}
  }

  .home-grid{display:flex; flex-direction:column; gap:14px; max-width:520px;}
  .home-tile{
    text-align:left; background:var(--panel); border:1px solid var(--line);
    border-left:3px solid var(--line); border-radius:0; padding:18px 20px;
    cursor:pointer; font-family:var(--sans); color:var(--text);
    transition:border-color .15s, transform .1s;
  }
  .home-tile:hover{transform:translateY(-1px);}
  .home-tile .tile-name{font-size:17px; font-weight:700;}
  .home-tile .tile-note{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .tile-patron{border-left-color:var(--gate);}
  .tile-patron:hover{border-color:var(--gate); border-left-color:var(--gate);}
  .tile-alert{border-left-color:var(--safety); background:#241413; border-color:#5c2521;}
  .tile-alert:hover{border-color:var(--safety); border-left-color:var(--safety);}
  .tile-admin{border-left-color:var(--super);}
  .tile-admin:hover{border-color:var(--super); border-left-color:var(--super);}
  @media (max-width:820px){
    .home-grid{max-width:100%;}
    .home-tile{padding:20px 18px;}
    .home-tile .tile-name{font-size:18px;}
  }

  .group-collapsed{
    grid-column:1/-1; display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; cursor:pointer; font-family:var(--sans); color:var(--text);
    text-align:left; width:100%;
  }
  .group-collapsed:hover{border-color:var(--muted);}
  .group-collapsed.group-done{border-left:3px solid var(--clear); border-radius:0;}
  .gc-title{display:block; font-size:13px; font-weight:700;}
  .gc-note{display:block; font-size:11px; color:var(--muted); margin-top:2px;}
  .gc-chev{color:var(--muted); font-size:18px;}
</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card" id="pinCard">
    <div class="login-brand">Faire Operations</div>
    <div class="login-title">Enter your PIN</div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="keypad" id="keypad"></div>
    <div class="login-error" id="loginError"></div>
    <button class="forgot-pin-link" id="forgotPinLink">Forgot PIN?</button>
    <div class="forgot-pin-panel" id="forgotPinPanel" style="display:none;">
      <div class="rb-label" style="text-align:left;">Verify your identity</div>
      <input type="text" id="forgotPinPhone" class="forgot-pin-input" placeholder="Phone number" />
      <input type="text" id="forgotPinLastName" class="forgot-pin-input" placeholder="Last name" />

// ---------------- Data layer ----------------
function objToArr(obj, idKey){
  if(!obj) return [];
  return Object.keys(obj).map(k=>{
    const v = obj[k] || {};
    return Object.assign({}, v, {[idKey || 'id']: k});
  });
}

function defaultLists(){
  return [
    {id:'managers', name:'Managers'},
    {id:'mt-hope-staff', name:'Mt Hope Staff'},
    {id:'security', name:'Security Personnel'},
    {id:'vendors-permanent', name:'Vendors \u2014 Permanent'},
    {id:'vendors-guest', name:'Vendors \u2014 Guest'},
    {id:'performers', name:'Performers'},
  ];
}

async function loadAll(uid){
  const who = uid || (loggedInUser && loggedInUser.id);
  if(!who) throw new Error('Not signed in.');
  const d = await callFn('getAppData', {userId: who});

  users = d.users || [];

  sites = SITE_CODES.map(code=>{
    const meta = (d.sites && d.sites[code] && d.sites[code].meta) || {};
    return {
      code,
      name: meta.name || code,
      tollFree: meta.tollFree || '',
      status: meta.status || 'pending',
      alertHeader: meta.alertHeader || (code === 'PARF' ? 'PRF OPERATIONS ALERT' : `${code} OPERATIONS ALERT`),
    };
  });

  recipientsBySite = {};
  optOutBySite = {};
  SITE_CODES.forEach(code=>{
    const siteNode = (d.sites && d.sites[code]) || {};
    const recNode = siteNode.recipients || {};
    recipientsBySite[code] = defaultLists().map(def=>{
      const r = recNode[def.id] || {};
      return {
        id: def.id,
        name: r.name || def.name,
        members: objToArr(r.members, 'mid').map(m=>Object.assign({active:true}, m)),
        lastReviewed: r.lastReviewed || null,
        reviewedBy: r.reviewedBy || null,
        fileName: r.fileName || null,
        importError: '',
      };
    });
    optOutBySite[code] = objToArr(siteNode.optOuts, 'oid');
  });

  activityLog = d.activityLog || [];

  const rs = d.reportSettings || {};
  reportSettings = {
    recipients: rs.recipients ? Object.values(rs.recipients) : [],
    cadence: rs.cadence || 'weekly',
    include: Object.assign(
      {alert_sent:true, drill_sent:true, login:false, list_changed:true, user_changed:true, optout:true},
      rs.include || {}
    ),
  };
}

function reportSaveError(what){
  return (e)=>{
    console.error('Save failed:', what, e);
    showToast('Could not save ' + what + ': ' + (e.message || 'database error'), true);
  };
}

function saveUser(u){
  return callFn('saveUserAccount', {
    actorId: loggedInUser && loggedInUser.id,
    action: 'update',
    target: {id: u.id, firstName: u.firstName, lastName: u.lastName, phone: u.phone,
             email: u.email, role: u.role, site: u.site},
  }).catch(e=>{ reportSaveError('account')(e); throw e; });
}
function deleteUser(id){
  return callFn('saveUserAccount', {
    actorId: loggedInUser && loggedInUser.id,
    action: 'delete',
    target: {id},
  }).catch(e=>{ reportSaveError('deletion')(e); throw e; });
}

function saveSiteMeta(s){
  return db.ref(`sites/${s.code}/meta`).set({name:s.name, tollFree:s.tollFree, status:s.status, alertHeader:s.alertHeader})
    .catch(reportSaveError('site settings'));
}

function saveList(site, r){
  const members = {};
  r.members.forEach((m, i)=>{
    const key = m.mid || ('m' + Date.now() + '_' + i);
    members[key] = {name: m.name, phone: m.phone, active: m.active !== false};
  });
  return db.ref(`sites/${site}/recipients/${r.id}`).set({
    name: r.name,
    lastReviewed: r.lastReviewed || null,
    reviewedBy: r.reviewedBy || null,
    fileName: r.fileName || null,
    members,
  }).catch(reportSaveError('recipient list'));
}

function saveOptOuts(site){
  const obj = {};
  (optOutBySite[site] || []).forEach((o, i)=>{
    const key = o.oid || ('o' + Date.now() + '_' + i);
    obj[key] = {name:o.name, phone:o.phone, date:o.date};
  });
  return db.ref(`sites/${site}/optOuts`).set(obj).catch(reportSaveError('opt-out list'));
}

function saveReportSettings(){
  const rec = {};
  reportSettings.recipients.forEach((e,i)=>{ rec['r'+i] = e; });
  return db.ref('reportSettings').set({
    recipients: rec,
    cadence: reportSettings.cadence,
    include: reportSettings.include,
  }).catch(reportSaveError('report settings'));
}

function renderPinDots(){
  const dots = document.getElementById('pinDots');
  dots.innerHTML = '';
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pinEntry.length ? ' filled':'');
    dots.appendChild(d);
  }
}

function renderKeypad(){
  const keypad = document.getElementById('keypad');
  keypad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
    const b = document.createElement('button');
    b.className = 'key';
    b.textContent = n;
    b.onclick = ()=> pressDigit(n);
    keypad.appendChild(b);
  });
  const clearBtn = document.createElement('button');
  clearBtn.className = 'key wide';
  clearBtn.textContent = 'Clear';

  keypad.appendChild(clearBtn);

  const zeroBtn = document.createElement('button');
  zeroBtn.className = 'key';
  zeroBtn.textContent = '0';
  zeroBtn.onclick = ()=> pressDigit('0');
  keypad.appendChild(zeroBtn);

  const backBtn = document.createElement('button');
  backBtn.className = 'key wide';
  backBtn.textContent = '⌫';
  backBtn.onclick = ()=>{ pinEntry = pinEntry.slice(0,-1); document.getElementById('loginError').textContent=''; renderPinDots(); };
  keypad.appendChild(backBtn);
}

function pressDigit(n){
  if(pinEntry.length >= 4) return;
  pinEntry += n;
  document.getElementById('loginError').textContent = '';
  renderPinDots();
  if(pinEntry.length === 4){
    setTimeout(attemptLogin, 120);
  }
}

let pendingVerifyUser = null;
let pendingPinChangeUser = null;
let verifyCode = '';

function notifyAdminsOfLogin(user, site){
  const superadmins = users.filter(u => u.role === 'superadmin');
  const when = new Date().toLocaleString();
  const siteLabel = site === 'ALL' ? 'the system (Superuser)' : `${site} \u2014 ${siteName(site)}`;
  const message = `Login alert: ${fullName(user)} (${roleLabel(user.role)}) logged into ${siteLabel} at ${when}.`;
  console.log('[Login notification]', message, '-> would text:', superadmins.map(s=>s.phone).join(', '));
  return {message, recipients: superadmins};
}

function maskPhone(phone){
  const digits = phone.replace(/[^\d]/g,'');
  return digits.length >= 4 ? `ending in ${digits.slice(-4)}` : phone;
}

function attemptLogin(){
  const pin = pinEntry;
  pinEntry = '';
  renderPinDots();
  document.getElementById('loginError').style.color = 'var(--muted)';
  document.getElementById('loginError').textContent = 'Checking\u2026';
  callFn('login', {pin})
    .then(res=>{
      pendingVerifyUser = {id: res.userId, mustChangePin: res.mustChangePin};
      document.getElementById('loginError').style.color = 'var(--safety)';
      document.getElementById('loginError').textContent = '';
      document.getElementById('pinCard').style.display = 'none';
      document.getElementById('verifyCard').style.display = 'block';
      document.getElementById('verifySentTo').textContent = `We sent a 6-digit code to your phone, ending in ${res.maskedPhone}.`;
      document.getElementById('verifyCodeInput').value = '';
      document.getElementById('verifyError').textContent = '';
      document.getElementById('verifyDemoNote').textContent = '';
    })
    .catch(e=>{
      document.getElementById('loginError').style.color = 'var(--safety)';
      document.getElementById('loginError').textContent = e.message || 'PIN not recognized.';
      pendingVerifyUser = null;
      renderPinDots();
    });
}

function completeLogin(){
  const uid = pendingVerifyUser.id;
  const forced = pendingVerifyUser.mustChangePin;
  pendingVerifyUser = null;
  if(forced){
    pendingPinChangeUser = uid;
    document.getElementById('verifyCard').style.display = 'none';
    document.getElementById('changePinCard').style.display = 'block';
    document.getElementById('changePinTitle').textContent = 'Set your PIN';
    document.getElementById('changePinWhy').textContent =
      'This account still uses its issued PIN. Choose your own before continuing.';
    document.getElementById('currentPinInput').style.display = 'none';
    document.getElementById('newPinInput').value = '';
    document.getElementById('confirmNewPinInput').value = '';
    document.getElementById('changePinError').textContent = '';
    return;
  }
  verifyCode = '';
  document.getElementById('verifyError').textContent = 'Loading\u2026';
  loadAll(uid)
    .then(()=>{
      loggedInUser = users.find(u=>u.id === uid);
      if(!loggedInUser){ throw new Error('Account not found after login.'); }
      currentRole = loggedInUser.role;
      currentView = 'home';
      activeSite = loggedInUser.role === 'superadmin' ? SITE_CODES[0] : loggedInUser.site;
      selected = new Set();
      document.getElementById('verifyError').textContent = '';
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appRoot').style.display = 'flex';
      renderAll();
    })
    .catch(e=>{
      document.getElementById('verifyError').textContent = e.message || 'Could not load your account.';
    });
}

function backToPinStage(){
  pendingVerifyUser = null;
  pendingPinChangeUser = null;
  verifyCode = '';
  document.getElementById('changePinCard').style.display = 'none';
  document.getElementById('verifyCard').style.display = 'none';
  document.getElementById('pinCard').style.display = 'block';
  pinEntry = '';
  renderPinDots();
}

function logOut(){
  loggedInUser = null;
  currentRole = null;
  activeSite = null;
  pinEntry = '';
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';

  document.getElementById('verifyCard').style.display = 'none';
  document.getElementById('pinCard').style.display = 'block';
  document.getElementById('loginError').textContent = '';

}

function parseCsv(text){
  const rows = [];
  let cur = '', row = [], inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ cur+='"'; i++; } else { inQuotes = false; }
      } else { cur += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(cur); cur=''; rows.push(row); row=[];
      } else { cur += c; }
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

function handleCsvImport(id, file){
  const recipients = recipientsBySite[activeSite];
  const r = recipients.find(x=>x.id===id);
  if(!file){ return; }
  if(!/\.csv$/i.test(file.name)){
    r.importError = 'Please choose a .csv file.';
    renderRecipients();
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const rows = parseCsv(String(e.target.result));
    if(rows.length < 2){
      r.importError = 'No rows found in that file.';
      renderRecipients();
      return;
    }
    const header = rows[0].map(h=>h.trim().toLowerCase());
    const nameIdx = header.findIndex(h=>h.includes('name'));
    const phoneIdx = header.findIndex(h=>h.includes('phone') || h.includes('mobile') || h.includes('cell'));
    if(phoneIdx === -1){
      r.importError = "Couldn't find a phone column. Header should include 'phone'.";
      renderRecipients();
      return;
    }
    const members = [];
    const badRows = [];
    const optedOutRows = [];
    const optOutDigits = optOutBySite[activeSite].map(o=>o.phone.replace(/[^\d]/g,''));
    rows.slice(1).forEach((row, i)=>{
      const phoneRaw = (row[phoneIdx] || '').trim();
      const digits = phoneRaw.replace(/[^\d]/g,'');
      const name = nameIdx !== -1 ? (row[nameIdx] || '').trim() : '';
      if(digits.length < 10){ badRows.push(i+2); return; }
      if(optOutDigits.includes(digits)){ optedOutRows.push(i+2); return; }
      const activeIdx = header.findIndex(h=>h.includes('active') || h.includes('status'));
      let isActive = true;
      if(activeIdx !== -1){
        const v = String(row[activeIdx] || '').trim().toLowerCase();
        isActive = !(v === 'no' || v === 'false' || v === 'inactive' || v === '0');
      }
      members.push({name: name || '(no name)', phone: phoneRaw, active: isActive});
    });
    r.members = members;
    r.fileName = file.name;
    r.lastReviewed = Date.now();
    r.reviewedBy = loggedInUser ? fullName(loggedInUser) : null;
    logActivity('list_changed', activeSite, `Imported ${members.length} into ${r.name} from ${file.name}`);
    saveList(activeSite, r);
    const skipNotes = [];
    if(badRows.length){ skipNotes.push(`${badRows.length} row(s) with no valid phone number`); }
    if(optedOutRows.length){ skipNotes.push(`${optedOutRows.length} row(s) already opted out`); }
    r.importError = skipNotes.length
      ? `Imported ${members.length} \u00b7 skipped ${skipNotes.join(', ')}.`
      : '';
    renderRecipients();
  };
  reader.onerror = ()=>{
    r.importError = 'Could not read that file.';
    renderRecipients();
  };
  reader.readAsText(file);
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  const sendable = canSend() && isSiteLive(activeSite);

  function makeCard(a){
    const el = document.createElement('button');
    el.className = 'alert-card' + (a.critical ? ' safety-critical':'');
    el.setAttribute('data-cat-card', a.cat);
    el.innerHTML = `<div class="badge">${categories.find(c=>c.id===a.cat).label}</div>
      <div class="name">${a.name}</div>
      <div class="preview">${a.text.replace(/\{time\}/g,'[time]').replace(/\{resume\}/g,'[resume]')}</div>`;
    if(sendable){
      el.onclick = ()=> openModal(a);
    } else {
      el.disabled = true;
      el.style.cursor = 'default';
      el.style.opacity = '.55';
    }
    return el;
  }

  if(!canSend()){
    const note = document.createElement('div');
    note.className = 'locked-note';
    note.textContent = "Your account can view alert types but can't send. Contact an admin to dispatch.";
    grid.appendChild(note);
  }

  const catAlerts = alerts.filter(a=>a.cat===activeCat);
  const groupsInOrder = [];
  catAlerts.forEach(a=>{ if(a.group && !groupsInOrder.includes(a.group)) groupsInOrder.push(a.group); });

  const opened = activeCat === 'gate' && gatesOpenedToday(activeSite);

  if(groupsInOrder.length){
    groupsInOrder.forEach(group=>{
      const wrap = document.createElement('div');
      wrap.className = 'subgroup';

      // Once gates are open, fold the opening group away and lead with closing.
      let collapsed = false;
      if(activeCat === 'gate' && !collapseOverride[group]){
        if(opened && group === 'opening') collapsed = true;
        if(!opened && group === 'closing') collapsed = true;
      }

      if(collapsed){
        const bar = document.createElement('button');
        bar.className = 'group-collapsed' + (group === 'opening' && opened ? ' group-done' : '');
        const count = catAlerts.filter(a=>a.group===group).length;
        const at = gatesOpenedAt(activeSite);
        bar.innerHTML = (group === 'opening' && opened)
          ? `<span><span class="gc-title">Opening \u2014 complete</span><span class="gc-note">Gates open ${at || ''}</span></span><span class="gc-chev">\u203a</span>`
          : `<span><span class="gc-title">${groupLabels[group] || group} \u2014 ${count} alerts</span></span><span class="gc-chev">\u203a</span>`;
        bar.onclick = ()=>{ collapseOverride[group] = true; renderCards(); };
        wrap.appendChild(bar);
        grid.appendChild(wrap);
        return;
      }

      const label = document.createElement('div');
      label.className = 'subgroup-label';
      label.textContent = groupLabels[group] || group;
      const sub = document.createElement('div');
      sub.className = 'subgroup-grid';
      catAlerts.filter(a=>a.group===group).forEach(a=> sub.appendChild(makeCard(a)));
      wrap.appendChild(label);
      wrap.appendChild(sub);
      grid.appendChild(wrap);
    });
  } else {
    catAlerts.forEach(a=> grid.appendChild(makeCard(a)));
  }
}

    const firstName = document.getElementById('newUserFirstName').value.trim();
    const phone = document.getElementById('newUserPhone').value.replace(/[()]/g, '').replace(/\s+/g,' ').trim();
    const email = document.getElementById('newUserEmail').value.trim();
    const pin = document.getElementById('newUserPin').value.trim();
    const role = document.getElementById('newUserRole').value;
    const site = role === 'superadmin' ? 'ALL' : (superadmin ? document.getElementById('newUserSite').value : activeSite);

    const missing = [];
    if(!lastName) missing.push('Last Name');
    if(!firstName) missing.push('First Name');
    if(!phone) missing.push('Phone');
    if(missing.length){
      err.textContent = 'Missing: ' + missing.join(', ');
      return;
    }
    if(phone.replace(/[^\d]/g,'').length < 10){
      err.textContent = 'Phone number needs at least 10 digits.';
      return;
    }
    if(!/^\d{4}$/.test(pin)){
      err.textContent = 'PIN must be exactly 4 digits.';
      return;
    }
    callFn('saveUserAccount', {
      actorId: loggedInUser.id,
      action: 'create',
      target: {firstName, lastName, phone, email, role, site, pin},
    })
      .then(()=> loadAll())
      .then(()=>{
        showToast(`${firstName} ${lastName} added as ${roleLabel(role)}`, false);
        renderAll();
      })
      .catch(e=>{
        err.textContent = e.message || 'Could not save the account.';
      });
  };
}

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Gates count as open once "Gates Open" has been sent for this site today.
// Reading from the activity log means it resets on its own at midnight and
// stays correct across devices without storing extra state.
function gatesOpenedToday(site){
  const key = todayKey();
  return activityLog.some(e =>
    e.type === 'alert_sent' &&
    e.site === site &&
    typeof e.detail === 'string' &&
    e.detail.startsWith('Gates Open ') &&
    new Date(e.ts).toLocaleDateString('en-CA') === key
  );
}

function gatesOpenedAt(site){
  const key = todayKey();
  const hit = activityLog.find(e =>
    e.type === 'alert_sent' && e.site === site &&
    typeof e.detail === 'string' && e.detail.startsWith('Gates Open ') &&
    new Date(e.ts).toLocaleDateString('en-CA') === key
  );
  return hit ? new Date(hit.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : null;
}

function renderUsersTable(){

  const staffBody = document.getElementById('staffBody');
  if(!staffBody) return;
  const superadmin = isSuperadmin();
  const visibleUsers = superadmin ? users : users.filter(u=>u.site===activeSite && u.role !== 'superadmin');
  if(superBody) superBody.innerHTML = '';
  staffBody.innerHTML = '';

  const supers = visibleUsers.filter(u=>u.role === 'superadmin');
  const staff = visibleUsers.filter(u=>u.role !== 'superadmin');

  if(superBody && supers.length === 0){
    superBody.innerHTML = `<tr><td colspan="8" style="color:var(--muted); text-align:center; padding:14px 0;">No Superusers.</td></tr>`;
  }
  if(staff.length === 0){
    staffBody.innerHTML = `<tr><td colspan="8" style="color:var(--muted); text-align:center; padding:14px 0;">No staff accounts${superadmin ? '' : ' for ' + activeSite}.</td></tr>`;

    out.push(...staffBody.querySelectorAll(sel));

  };

    if(!target) return;

    const editing = editingUserId === u.id;
    const isLastSuperuser = u.role === 'superadmin' && users.filter(x=>x.role==='superadmin').length === 1;
    if(editing){ tr.className = 'editing-row'; }
    const dis = editing ? '' : 'disabled';
    const siteCell = superadmin
      ? `<select class="site-select" data-id="${u.id}" ${dis}>${SITE_CODES.map(c=>`<option value="${c}" ${u.site===c?'selected':''}>${c}</option>`).join('')}${u.site==='ALL' ? `<option value="ALL" selected>ALL</option>` : ''}</select>`
      : `<span class="pin-cell">${u.site}</span>`;

      <td><input class="lastname-input" data-id="${u.id}" value="${u.lastName}" ${dis} style="width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-family:var(--sans);" /></td>
      <td><input class="firstname-input" data-id="${u.id}" value="${u.firstName}" ${dis} style="width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-family:var(--sans);" /></td>
      <td><input class="phone-input" data-id="${u.id}" value="${u.phone}" ${dis} style="width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-family:var(--mono);" /></td>
      <td><input class="email-input" data-id="${u.id}" value="${u.email || ''}" placeholder="none set" ${dis} style="width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-family:var(--sans);" /></td>
      <td>${siteCell}</td>
      <td><input class="pin-cell-input" data-id="${u.id}" value="" placeholder="\u2022\u2022\u2022\u2022" maxlength="4" ${dis} title="PINs are encrypted and cannot be displayed. Type a new 4-digit PIN to change it." style="width:56px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 6px; font-family:var(--mono);" /></td>
      <td>
        <span class="role-badge" id="roleIcon-${u.id}">${roleIcon(u.role)}</span>
        <select class="role-select" data-id="${u.id}" ${dis}>
          <option value="admin" ${u.role==='admin'?'selected':''}>Operations Manager</option>
          ${superadmin ? `<option value="superadmin" ${u.role==='superadmin'?'selected':''}>Superuser</option>` : ''}
        </select>

      <td>
        <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-start;">

            : `<button class="remove-link" data-id="${u.id}">Delete</button>`}

    `;

  });

    btn.onclick = ()=>{
      editingUserId = (editingUserId === btn.dataset.id) ? null : btn.dataset.id;
      renderUsersTable();
    };
  });
  userRowsQuery('.lastname-input').forEach(inp=>{
    inp.onchange = ()=>{
      const u = users.find(x=>x.id===inp.dataset.id);
      u.lastName = inp.value.trim() || u.lastName;
      inp.value = u.lastName;
      saveUser(u);
    };
  });
  userRowsQuery('.firstname-input').forEach(inp=>{
    inp.onchange = ()=>{
      const u = users.find(x=>x.id===inp.dataset.id);
      u.firstName = inp.value.trim() || u.firstName;
      inp.value = u.firstName;
      saveUser(u);
    };
  });
  userRowsQuery('.phone-input').forEach(inp=>{
    inp.onchange = ()=>{
      const u = users.find(x=>x.id===inp.dataset.id);
      const cleaned = inp.value.replace(/[()]/g, '').replace(/\s+/g,' ').trim();
      u.phone = cleaned || u.phone;
      inp.value = u.phone;
      saveUser(u);
    };
  });
  userRowsQuery('.email-input').forEach(inp=>{
    inp.onchange = ()=>{
      const u = users.find(x=>x.id===inp.dataset.id);
      u.email = inp.value.trim();
      saveUser(u);
    };
  });
  userRowsQuery('.reset-pin-link').forEach(btn=>{
    btn.onclick = ()=>{
      const u = users.find(x=>x.id===btn.dataset.id);
      callFn('adminResetPin', {actorId: loggedInUser.id, targetId: u.id})
        .then(res=>{
          showToast(`New PIN texted to ${fullName(u)}, ending in ${res.maskedPhone}`, false);
        })
        .catch(e=>{
          showToast(e.message || 'Could not reset that PIN.', true);
        });
    };
  });
  userRowsQuery('.role-select').forEach(sel=>{
    sel.onchange = ()=>{
      const u = users.find(x=>x.id===sel.dataset.id);

      // Same protection as delete: can't leave the system with zero Superusers
      if(u.role === 'superadmin' && sel.value !== 'superadmin'){
        const otherSuperusers = users.filter(x=>x.role==='superadmin' && x.id!==u.id);
        if(otherSuperusers.length === 0){
          window.alert("Can't change the only Superuser to another role. Assign another Superuser first.");
          sel.value = 'superadmin';
          return;
        }
      }

      logActivity('user_changed', u.site, `${fullName(u)} role changed to ${roleLabel(sel.value)}`);
      u.role = sel.value;
      if(u.role === 'superadmin'){ u.site = 'ALL'; }
      else if(u.site === 'ALL'){ u.site = activeSite; }
      if(loggedInUser && loggedInUser.id === u.id){ currentRole = u.role; }
      saveUser(u);
      editingUserId = null;
      renderAll();
    };
  });
  userRowsQuery('.site-select').forEach(sel=>{
    sel.onchange = ()=>{
      const u = users.find(x=>x.id===sel.dataset.id);
      u.site = sel.value;
      saveUser(u);
    };
  });
  userRowsQuery('.pin-cell-input').forEach(inp=>{
    inp.onchange = ()=>{
      const u = users.find(x=>x.id===inp.dataset.id);
      const v = inp.value.trim();
      if(/^\d{4}$/.test(v)){
        callFn('saveUserAccount', {actorId: loggedInUser.id, action:'update', target:{id:u.id, pin:v}})
          .then(()=>{ showToast('PIN updated for ' + fullName(u), false); inp.value=''; inp.placeholder='••••'; })
          .catch(e=> showToast(e.message || 'Could not update the PIN.', true));
      } else { inp.value = ''; }
    };
  });
  userRowsQuery('.remove-link').forEach(btn=>{
    btn.onclick = ()=>{
      const target = users.find(u=>u.id===btn.dataset.id);
      if(target && target.role === 'superadmin'){
        const otherSuperadmins = users.filter(u=>u.role==='superadmin' && u.id!==target.id);
        if(otherSuperadmins.length === 0){
          window.alert("Can't delete the only Superuser. Assign another Superuser first, then delete this one.");
          return;
        }
      }
      logActivity('user_changed', target ? target.site : '\u2014', `Deleted account ${target ? fullName(target) : ''}`);
      deleteUser(btn.dataset.id);
      users = users.filter(u=>u.id!==btn.dataset.id);
      if(editingUserId === btn.dataset.id){ editingUserId = null; }
      renderUsersTable();
    };
  });
}

function reviewStatus(r){
  if(!r.lastReviewed) return {text:'Never reviewed', stale:true};
  const days = Math.floor((Date.now() - r.lastReviewed) / 86400000);
  const when = new Date(r.lastReviewed).toLocaleDateString();
  if(days >= 7) return {text:`Last reviewed ${when} (${days}d ago) \u2014 review due`, stale:true};
  return {text:`Last reviewed ${when} by ${r.reviewedBy || 'unknown'}`, stale:false};
}

          <td><select class="active-select" data-act="${r.id}" data-idx="${idx}"

      const phoneEl = holder.querySelector(`[data-addphone="${id}"]`);
      const name = nameEl.value.trim();
      const phone = phoneEl.value.replace(/[()]/g,'').replace(/\s+/g,' ').trim();

      if(!name || digits.length < 10) return;
      const optedOut = optOutBySite[activeSite].some(o=>o.phone.replace(/[^\d]/g,'')===digits);
      if(optedOut){

        const changed = (newName !== m.name) || (newPhone !== m.phone);

        m.phone = newPhone;
        editingMemberKey = null;
        if(changed){
          logActivity('list_changed', activeSite, `Edited ${newName} on ${r.name}`);

      saveList(activeSite, r);
      renderAll();

  holder.querySelectorAll('[data-rm]').forEach(btn=>{

      logActivity('list_changed', activeSite, `Removed ${removed ? removed.name : 'someone'} from ${r.name}`);
      saveList(activeSite, r);
      renderAll();
    };

      const count = r.members.filter(m=>m.active===false).length;
      if(!count) return;
      if(!window.confirm(`Set all ${count} inactive ${count===1?'person':'people'} on ${r.name} back to active?\n\nThey will start receiving alerts again.`)) return;
      r.members.forEach(m=>{ m.active = true; });
      logActivity('list_changed', activeSite, `Set ${count} back to active on ${r.name}`);
      saveList(activeSite, r);
      showToast(`${count} set active on ${r.name}`, false);
      renderAll();
    };
  });

  holder.querySelectorAll('[data-review]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = recipients.find(x=>x.id===btn.dataset.review);
      r.lastReviewed = Date.now();
      r.reviewedBy = fullName(loggedInUser);
      logActivity('list_changed', activeSite, `${r.name} marked reviewed`);
      saveList(activeSite, r);
      showToast(`${r.name} marked reviewed.`, false);
      renderAll();
    };
  });
}

function fmtWhen(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function buildReportSummary(sinceMs, scopeSite){
  const cutoff = Date.now() - sinceMs;
  const entries = activityLog.filter(e =>
    e.ts >= cutoff &&
    reportSettings.include[e.type] &&
    (!scopeSite || e.site === scopeSite)
  );
  const byType = {};
  entries.forEach(e=>{ byType[e.type] = (byType[e.type]||0) + 1; });
  const alerts = entries.filter(e=>e.type==='alert_sent');
  const reach = alerts.reduce((n,e)=> n + (e.meta && e.meta.recipients ? e.meta.recipients : 0), 0);
  return {entries, byType, alertCount: alerts.length, reach};
}

function previewReport(cadenceMs, scopeSite){
  const s = buildReportSummary(cadenceMs, scopeSite);
  const period = reportSettings.cadence === 'daily' ? 'Daily' : reportSettings.cadence === 'monthly' ? 'Monthly' : 'Weekly';
  const lines = [];
  if(scopeSite){
    lines.push(`${period} Alert System Report \u2014 ${scopeSite} (${siteName(scopeSite)})`);
    lines.push(`Lancelot Entertainment Investment Co`);
  } else {
    lines.push(`${period} Alert System Report \u2014 Lancelot Entertainment Investment Co`);
  }
  lines.push(`Generated ${new Date().toLocaleString()}`);
  lines.push('='.repeat(62));
  lines.push('');
  lines.push(scopeSite ? 'SUMMARY' : 'COMPANY-WIDE');
  lines.push(`  Alerts sent: ${s.alertCount}`);
  lines.push(`  Recipients reached: ${s.reach}`);
  Object.keys(s.byType).forEach(k=>{
    lines.push(`  ${(EVENT_TYPES[k]||{label:k}).label}: ${s.byType[k]}`);
  });
  lines.push('');
  const codes = scopeSite ? [scopeSite] : SITE_CODES;
  lines.push(scopeSite ? 'PROPERTY STATUS' : 'BY PROPERTY');
  codes.forEach(code=>{
    const siteEntries = s.entries.filter(e=>e.site === code);
    const siteAlerts = siteEntries.filter(e=>e.type === 'alert_sent');
    const siteReach = siteAlerts.reduce((n,e)=> n + (e.meta && e.meta.recipients ? e.meta.recipients : 0), 0);
    const statusTag = isSiteLive(code) ? '' : '  [not live]';
    lines.push(`  ${code} \u2014 ${siteName(code)}${statusTag}`);
    if(siteEntries.length === 0){
      lines.push('    No activity.');
    } else {
      lines.push(`    Alerts sent: ${siteAlerts.length}   Recipients reached: ${siteReach}   Total events: ${siteEntries.length}`);
      const lists = recipientsBySite[code] || [];
      const roster = lists.reduce((n,r)=>n + r.members.length, 0);
      const stale = lists.filter(r=>reviewStatus(r).stale).map(r=>r.name);
      lines.push(`    Roster: ${roster} on ${lists.length} list(s)${stale.length ? `   Review overdue: ${stale.join(', ')}` : ''}`);
      lines.push(`    Opt-outs on record: ${(optOutBySite[code]||[]).length}`);
    }
    lines.push('');
  });
  if(s.entries.length === 0){
    lines.push('No activity in this period.');
  } else {
    lines.push('EVENT DETAIL');
    s.entries.slice(0,40).forEach(e=>{
      lines.push(`  ${fmtWhen(e.ts)}  [${e.site}]  ${(EVENT_TYPES[e.type]||{label:e.type}).label} \u2014 ${e.detail} (${e.actor})`);
    });
  }
  const text = lines.join('\n');
  console.log('[Report email]\n' + text + '\n-> would email:', reportSettings.recipients.join(', ') || '(no recipients set)');

  const box = document.getElementById('reportPreview');
  box.innerHTML = `
    <div class="msg-box" style="margin-top:14px; max-height:280px; overflow:auto;">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
    <div class="import-picker-note">${reportSettings.recipients.length
      ? `Demo mode (no email backend yet) \u2014 would send to ${reportSettings.recipients.join(', ')}`
      : 'Add a recipient email address above before this can send.'}</div>
  `;
  if(reportSettings.recipients.length){
    showToast(`Report generated for ${reportSettings.recipients.length} recipient(s)`, false);
  }
}

function formatTime12(hhmm){
  if(!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

function defaultTimeValue(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function nextQuarterHour(hhmm){
  let [h, m] = hhmm.split(':').map(Number);
  let total = h * 60 + m;
  const rem = total % 15;
  if(rem !== 0){ total += (15 - rem); }
  total = total % (24*60);
  const nh = Math.floor(total/60);
  const nm = total % 60;
  return String(nh).padStart(2,'0') + ':' + String(nm).padStart(2,'0');
}

function siteHeader(code){
  const s = sites.find(x=>x.code===code);
  return ((s && s.alertHeader) || `${code} OPERATIONS ALERT`).toUpperCase();
}

function buildMessage(alert, timeVal, resumeVal){
  const shown = timeVal ? formatTime12(timeVal) : '[enter time]';
  let msg = alert.text.replace('{time}', shown);
  if(msg.includes('{resume}')){
    msg = msg.replace('{resume}', formatTime12(resumeVal));
  }
  return siteHeader(activeSite) + '\n' + msg;
}

function openModal(alertDef){
  const alert = alertDef;
  const recipients = recipientsBySite[activeSite];
  if(selected.size===0){
    window.alert('Select at least one recipient list first.');
    return;
  }
  const emptyLists = recipients.filter(r=>selected.has(r.id) && r.members.filter(m=>m.active!==false).length === 0);
  if(emptyLists.length === selected.size){
    window.alert('The selected list' + (selected.size>1?'s have':' has') + ' no one on ' + (selected.size>1?'them':'it') + ' yet. Add recipients before sending.');
    return;
  }
  pendingAlert = alert;
  confirmStep = 1;
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const isCritical = !!alert.critical;
  const needsTime = alert.text.includes('{time}');
  modal.className = 'modal' + (isCritical ? ' danger':'');
  document.getElementById('modalEyebrow').textContent = isCritical ? 'Double confirmation required' : 'Confirm send';
  document.getElementById('modalTitle').textContent = alert.name + ' \u2014 ' + activeSite;
  document.getElementById('confirmPinInput').value = '';
  document.getElementById('pinConfirmError').textContent = '';
  document.getElementById('authSlot').innerHTML = '';
  authCode = '';
  authApprovers = [];

  const toRow = document.getElementById('toRow');
  toRow.innerHTML = '';
  recipients.filter(r=>selected.has(r.id)).forEach(r=>{
    const p = document.createElement('span');
    p.className = 'to-pill';
    p.textContent = r.name + ' (' + r.members.filter(m=>m.active!==false).length + ')';
    toRow.appendChild(p);
  });

  const timeSlot = document.getElementById('timeSlot');
  if(needsTime){
    const defaultVal = defaultTimeValue();
    const needsResume = alert.text.includes('{resume}');
    if(needsResume){
      const resumeDefault = nextQuarterHour(defaultVal);
      timeSlot.innerHTML = `
        <div class="time-row"><label for="timeInput">Time</label><input type="time" id="timeInput" value="${defaultVal}" /></div>
        <div class="time-row"><label for="resumeInput">Resume</label><input type="time" id="resumeInput" value="${resumeDefault}" /></div>
      `;
      const refresh = ()=>{
        const t = document.getElementById('timeInput').value;
        const r = document.getElementById('resumeInput').value;
        document.getElementById('msgBox').textContent = buildMessage(alert, t, r);
        updateCharCount();
      };
      document.getElementById('msgBox').textContent = buildMessage(alert, defaultVal, resumeDefault);
      document.getElementById('timeInput').oninput = refresh;
      document.getElementById('resumeInput').oninput = refresh;
    } else if(alert.futureTime){
      // This time is a future event the manager must supply — never default to
      // the current clock, or a stray Send broadcasts the wrong time.
      timeSlot.innerHTML = `
        <div class="time-row">
          <label for="timeInput">Time</label>
          <input type="time" id="timeInput" value="" style="border-color:var(--weather);" />
          <span style="font-size:11.5px; color:var(--weather);">required</span>
        </div>`;
      document.getElementById('msgBox').textContent = buildMessage(alert, '');
      document.getElementById('timeInput').oninput = (e)=>{
        document.getElementById('msgBox').textContent = buildMessage(alert, e.target.value);
        document.getElementById('timeInput').style.borderColor = e.target.value ? 'var(--clear)' : 'var(--weather)';
        updateCharCount();
      };
    } else {
      timeSlot.innerHTML = `<div class="time-row"><label for="timeInput">Time</label><input type="time" id="timeInput" value="${defaultVal}" /></div>`;
      document.getElementById('msgBox').textContent = buildMessage(alert, defaultVal);
      document.getElementById('timeInput').oninput = (e)=>{
        document.getElementById('msgBox').textContent = buildMessage(alert, e.target.value);
        updateCharCount();
      };
    }
  } else {
    timeSlot.innerHTML = '';
    document.getElementById('msgBox').textContent = siteHeader(activeSite) + '\n' + alert.text;
  }
  updateCharCount();

  const warnSlot = document.getElementById('warnSlot');
  const stepTrack = document.getElementById('stepTrack');
  const confirmBtn = document.getElementById('confirmBtn');

  if(isCritical){
    warnSlot.innerHTML = `<div class="warn-box">This dispatches an Active Shooter alert to every recipient in the lists above. Step 1 of 2 \u2014 review the message, then continue.</div>`;
    stepTrack.style.display = 'flex';
    document.getElementById('s1').className = 'done';
    document.getElementById('s2').className = '';
    confirmBtn.textContent = 'Continue';
    confirmBtn.className = 'btn primary danger';
  } else {
    warnSlot.innerHTML = '';
    stepTrack.style.display = 'none';
    confirmBtn.textContent = 'Send now';
    confirmBtn.className = 'btn primary';
  }

  overlay.classList.add('show');
}

function updateCharCount(){
  const t = document.getElementById('msgBox').innerText;
  document.getElementById('charCount').textContent = t.length + ' characters';
}
document.getElementById('msgBox').addEventListener('input', updateCharCount);

document.getElementById('cancelBtn').onclick = closeModal;
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  pendingAlert = null;
}

document.getElementById('confirmBtn').onclick = ()=>{
  if(!pendingAlert) return;
  const isCritical = !!pendingAlert.critical;

  if(isCritical && confirmStep===1){
    confirmStep = 2;

    document.getElementById('warnSlot').innerHTML = `<div class="warn-box"><strong>Final confirmation.</strong> This will immediately text all selected lists the Active Shooter alert shown above. This cannot be undone once sent.</div>`;
    document.getElementById('s2').className = 'done';
    document.getElementById('authSlot').innerHTML = `<div class="warn-box">Sending an authorization code to your phone, ${maskPhone(loggedInUser.phone)}\u2026</div>`;
    document.getElementById('confirmBtn').textContent = 'Confirm \u2014 send Active Shooter alert';

    callFn('sendVerificationCode', {userId: loggedInUser.id, purpose: 'authorize'})
      .then(()=>{
        document.getElementById('authSlot').innerHTML = `
          <div class="warn-box">A 6-digit authorization code was sent to your phone, ${maskPhone(loggedInUser.phone)}. Enter it below along with your PIN.</div>
          <div class="time-row">
            <label for="authCodeInput">Auth code</label>
            <input type="text" id="authCodeInput" maxlength="6" inputmode="numeric" placeholder="******" style="width:110px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; font-size:13px; font-family:var(--mono); letter-spacing:3px;" />
          </div>
        `;
      })
      .catch(e=>{
        document.getElementById('authSlot').innerHTML = `<div class="warn-box">Could not send the authorization code: ${e.message || 'unknown error'}</div>`;
      });
    return;
  }




  const recipients = recipientsBySite[activeSite];
  const chosen = recipients.filter(r=>selected.has(r.id));
  const names = chosen.map(r=>r.name).join(', ');
  const alertName = pendingAlert.name;
  const site = activeSite;
  const isDrill = pendingAlert.cat === 'test';
  let messageText = document.getElementById('msgBox').innerText;
  const hdr = siteHeader(site);
  if(messageText.startsWith(hdr)){
    messageText = messageText.slice(hdr.length).replace(/^\s*\n/, '');
  }
  const enteredAuth = (document.getElementById('authCodeInput')?.value || '').trim();

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  document.getElementById('pinConfirmError').style.color = 'var(--muted)';
  document.getElementById('pinConfirmError').textContent = 'Sending\u2026';

  if(pendingAlert.futureTime){
    const t = document.getElementById('timeInput');
    if(!t || !t.value){
      btn.disabled = false;
      document.getElementById('pinConfirmError').style.color = 'var(--safety)';
      document.getElementById('pinConfirmError').textContent = 'Enter the time before sending.';
      if(t) t.style.borderColor = 'var(--safety)';
      return;
    }
  }

  const enteredPin = document.getElementById('confirmPinInput').value.trim();
  if(!/^\d{4}$/.test(enteredPin)){
    btn.disabled = false;
    document.getElementById('pinConfirmError').style.color = 'var(--safety)';
    document.getElementById('pinConfirmError').textContent = 'Enter your 4-digit PIN to send.';
    return;
  }

  const proceed = isCritical
    ? callFn('verifyCode', {userId: loggedInUser.id, code: enteredAuth})
    : Promise.resolve();

  proceed
    .then(()=> callFn('sendAlert', {
      userId: loggedInUser.id,
      pin: enteredPin,
      site,
      listIds: chosen.map(r=>r.id),
      message: messageText,
      alertName,
      category: pendingAlert.cat,
      isDrill,
    }))
    .then(res=>{
      btn.disabled = false;
      document.getElementById('pinConfirmError').style.color = 'var(--safety)';
      closeModal();
      const failNote = res.failed ? ` (${res.failed} failed)` : '';
      showToast(`${alertName} sent to ${res.sent} recipient(s) \u2014 ${site}${failNote}`, isCritical);
      loadAll().then(renderAll);
    })
    .catch(e=>{
      btn.disabled = false;
      document.getElementById('pinConfirmError').style.color = 'var(--safety)';
      document.getElementById('pinConfirmError').textContent = e.message || 'Send failed.';
    });
};

  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (danger ? ' danger-toast':'');
  setTimeout(()=> toast.className = 'toast', 3200);
}

// Rate limiting for PIN resets. NOTE: client-side only in this prototype —
// this must be enforced server-side (Cloud Function) to actually be effective.
const RESET_MAX_PER_WINDOW = 3;
const RESET_WINDOW_MS = 60 * 60 * 1000;   // 1 hour
const RESET_COOLDOWN_MS = 60 * 1000;      // 60 seconds between requests
let resetAttempts = {};                   // digits -> [timestamps]

function resetRateCheck(digits){
  const now = Date.now();
  const history = (resetAttempts[digits] || []).filter(t => now - t < RESET_WINDOW_MS);
  resetAttempts[digits] = history;
  if(history.length >= RESET_MAX_PER_WINDOW){
    const oldest = Math.min(...history);
    const mins = Math.ceil((RESET_WINDOW_MS - (now - oldest)) / 60000);
    return {ok:false, reason:`Too many reset requests. Try again in about ${mins} minute(s), or contact your Operations Manager.`};
  }
  if(history.length && now - Math.max(...history) < RESET_COOLDOWN_MS){
    const secs = Math.ceil((RESET_COOLDOWN_MS - (now - Math.max(...history))) / 1000);
    return {ok:false, reason:`Please wait ${secs} second(s) before requesting another PIN.`};
  }
  return {ok:true};
}

function recordResetAttempt(digits){
  if(!resetAttempts[digits]) resetAttempts[digits] = [];
  resetAttempts[digits].push(Date.now());
}

function setupForgotPin(){
  const link = document.getElementById('forgotPinLink');
  const panel = document.getElementById('forgotPinPanel');
  const sendBtn = document.getElementById('forgotPinSendBtn');
  const msg = document.getElementById('forgotPinMessage');

  link.onclick = ()=>{
    const showing = panel.style.display !== 'none';
    panel.style.display = showing ? 'none' : 'block';
    link.textContent = showing ? 'Forgot PIN?' : 'Cancel';
    msg.textContent = '';
    msg.style.color = 'var(--safety)';
    document.getElementById('forgotPinPhone').value = '';
    document.getElementById('forgotPinLastName').value = '';
  };

  sendBtn.onclick = ()=>{
    msg.style.color = 'var(--safety)';
    const raw = document.getElementById('forgotPinPhone').value;
    const lastName = document.getElementById('forgotPinLastName').value.trim();
    const digits = raw.replace(/[^\d]/g,'');

    if(digits.length < 10 || !lastName){
      msg.textContent = 'Enter both your phone number and last name.';
      return;
    }

    msg.textContent = 'Sending\u2026';
    callFn('resetPin', {phone: raw, lastName})
      .then(()=>{
        msg.style.color = 'var(--clear)';
        msg.textContent = 'If those details match an account, a new PIN has been sent by text.';
      })
      .catch(e=>{
        msg.style.color = 'var(--safety)';
        msg.textContent = e.message || 'Could not process that request.';
      });
  };
}

function setBootState(msg, isError){
  const el = document.getElementById('loginError');
  const title = document.querySelector('#pinCard .login-title');
  if(title) title.textContent = msg;
  if(el && isError){ el.textContent = 'Check your connection and refresh.'; }
}

async function boot(){
  setBootState('Connecting\u2026');
  document.getElementById('keypad').style.opacity = '.3';
  document.getElementById('keypad').style.pointerEvents = 'none';
  try {
    await firebase.auth().signInAnonymously();
    document.getElementById('keypad').style.opacity = '';
    document.getElementById('keypad').style.pointerEvents = '';
    setBootState('Enter your PIN');
    renderPinDots();
    renderKeypad();
    setupForgotPin();
  } catch(err){
    console.error('Boot failed', err);
    setBootState('Connection failed', true);
    document.getElementById('loginError').textContent = err.message || 'Could not reach the database.';
  }
}

boot();

document.getElementById('verifyCodeBtn').onclick = ()=>{
  const entered = document.getElementById('verifyCodeInput').value.trim();
  if(!pendingVerifyUser){ return; }
  const btn = document.getElementById('verifyCodeBtn');
  btn.disabled = true;
  document.getElementById('verifyError').textContent = 'Checking\u2026';
  callFn('verifyCode', {userId: pendingVerifyUser.id, code: entered})
    .then(()=>{ btn.disabled = false; completeLogin(); })
    .catch(e=>{
      btn.disabled = false;
      document.getElementById('verifyError').textContent = e.message || 'That code does not match.';
      document.getElementById('verifyCodeInput').value = '';
    });
};
document.getElementById('verifyBackBtn').onclick = backToPinStage;

function openChangePin(){
  pendingPinChangeUser = loggedInUser.id;
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pinCard').style.display = 'none';
  document.getElementById('verifyCard').style.display = 'none';
  document.getElementById('changePinCard').style.display = 'block';
  document.getElementById('changePinTitle').textContent = 'Change your PIN';
  document.getElementById('changePinWhy').textContent = 'Enter your current PIN, then choose a new one.';
  document.getElementById('currentPinInput').style.display = '';
  document.getElementById('currentPinInput').value = '';
  document.getElementById('newPinInput').value = '';
  document.getElementById('confirmNewPinInput').value = '';
  document.getElementById('changePinError').textContent = '';
}

document.getElementById('savePinBtn').onclick = ()=>{
  const err = document.getElementById('changePinError');
  const btn = document.getElementById('savePinBtn');
  const currentEl = document.getElementById('currentPinInput');
  const cur = currentEl.style.display === 'none' ? '' : currentEl.value.trim();
  const nw  = document.getElementById('newPinInput').value.trim();
  const cf  = document.getElementById('confirmNewPinInput').value.trim();

  err.style.color = 'var(--safety)';
  if(!/^\d{4}$/.test(nw)){ err.textContent = 'New PIN must be exactly 4 digits.'; return; }
  if(nw !== cf){ err.textContent = 'The two new PINs do not match.'; return; }

  btn.disabled = true;
  err.style.color = 'var(--muted)';
  err.textContent = 'Saving\u2026';

  callFn('changePin', {userId: pendingPinChangeUser, currentPin: cur, newPin: nw})
    .then(()=>{
      btn.disabled = false;
      const uid = pendingPinChangeUser;
      pendingPinChangeUser = null;
      err.style.color = 'var(--clear)';
      err.textContent = 'PIN updated.';
      return loadAll(uid).then(()=>{
        loggedInUser = users.find(u=>u.id === uid);
        currentRole = loggedInUser.role;
        currentView = 'send';
        activeSite = loggedInUser.role === 'superadmin' ? SITE_CODES[0] : loggedInUser.site;
        selected = new Set();
        document.getElementById('changePinCard').style.display = 'none';
        document.getElementById('pinCard').style.display = 'block';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appRoot').style.display = 'flex';
        renderAll();
        showToast('PIN updated.', false);
      });
    })
    .catch(e=>{
      btn.disabled = false;
      err.style.color = 'var(--safety)';
      err.textContent = e.message || 'Could not change the PIN.';
    });
};
</script>
